<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Product</title>
    <link rel="stylesheet" href="css_main.css">
</head>

<body>

    <header>
        <div class="header-left">
            <button type="button" class="back-btn" onclick="history.back()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
                Back
            </button>
            <a href="index.html" class="back-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
                Home
            </a>
        </div>
        <div class="header-icons">
            <div class="icon-btn">
                <a href="wishlist.html" aria-label="Wishlist">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.35-9.5-8.5C1 8 2.5 4.5 6 4.5c2 0 3.5 1.2 4.5 2.8 1-1.6 2.5-2.8 4.5-2.8 3.5 0 5 3.5 3.5 7-2.5 4.15-9.5 8.5-9.5 8.5z"/></svg>
                </a>
            </div>
            <div class="icon-btn">
                <a href="cart.html" aria-label="Cart">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="18" cy="21" r="1"/><path d="M2.5 3h2l2.4 12.2a2 2 0 0 0 2 1.6h8.4a2 2 0 0 0 2-1.6L21 7H6"/></svg>
                    <span class="cart-badge">0</span>
                </a>
            </div>
            <div class="icon-btn">
                <a href="account.html" aria-label="Account">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 20c1-4 4.5-6 7.5-6s6.5 2 7.5 6"/></svg>
                </a>
            </div>
        </div>
    </header>

    <main>
        <div class="product-view">
            <div class="product-illustration" id="productIllustration"></div>
            <h1 id="productName">Product</h1>
            <div class="price" id="productPrice"></div>
            <div class="fp-actions" style="justify-content: center;">
                <button id="addToCartBtn" class="btn btn-primary add-cart-btn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="18" cy="21" r="1"/><path d="M2.5 3h2l2.4 12.2a2 2 0 0 0 2 1.6h8.4a2 2 0 0 0 2-1.6L21 7H6"/></svg>
                    Add to cart
                </button>
                <button id="wishlistBtn" class="wishlist-btn" aria-label="Add to wishlist">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.35-9.5-8.5C1 8 2.5 4.5 6 4.5c2 0 3.5 1.2 4.5 2.8 1-1.6 2.5-2.8 4.5-2.8 3.5 0 5 3.5 3.5 7-2.5 4.15-9.5 8.5-9.5 8.5z"/></svg>
                </button>
            </div>
        </div>
    </main>

    <script src="cart.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const name = params.get('product') || 'Unnamed product';
        const price = params.get('price') || '0';

        document.getElementById('productName').textContent = name;
        document.getElementById('productPrice').textContent = '$' + parseFloat(price).toFixed(2);

        const btn = document.getElementById('addToCartBtn');
        btn.dataset.name = name;
        btn.dataset.price = price;

        const wishBtn = document.getElementById('wishlistBtn');
        wishBtn.dataset.name = name;
        wishBtn.dataset.price = price;

        const icon = PRODUCT_ICONS[name];
        const illo = document.getElementById('productIllustration');
        if (icon) {
            illo.style.background = icon.bg;
            illo.style.color = icon.color;
            illo.innerHTML = '<svg viewBox="0 0 100 100">' + icon.svg + '</svg>';
        }
    </script>

</body>

</html>
