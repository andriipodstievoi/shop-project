<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Product</title>
    <link rel="stylesheet" href="css_main.css">
</head>

<body>

    <header>
        <div class="header-left">
            <button type="button" class="back-btn" onclick="history.back()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
                Back
            </button>
            <a href="index.html" class="back-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
                Home
            </a>
            <a href="products.html" class="back-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
                Shop
            </a>
        </div>
        <div class="header-icons">
            <div class="icon-btn">
                <a href="wishlist.html" aria-label="Wishlist">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.35-9.5-8.5C1 8 2.5 4.5 6 4.5c2 0 3.5 1.2 4.5 2.8 1-1.6 2.5-2.8 4.5-2.8 3.5 0 5 3.5 3.5 7-2.5 4.15-9.5 8.5-9.5 8.5z"/></svg>
                </a>
            </div>
            <div class="icon-btn">
                <a href="cart.html" aria-label="Cart">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="21" r="1"/><circle cx="18" cy="21" r="1"/><path d="M2.5 3h2l2.4 12.2a2 2 0 0 0 2 1.6h8.4a2 2 0 0 0 2-1.6L21 7H6"/></svg>
                    <span class="cart-badge">0</span>
                </a>
            </div>
            <div class="icon-btn">
                <a href="account.html" aria-label="Account">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 20c1-4 4.5-6 7.5-6s6.5 2 7.5 6"/></svg>
                </a>
            </div>
        </div>
    </header>

    <main>
        <div class="product-view" id="productView"></div>
    </main>

    <script src="cart.js"></script>
    <script>
        // Only the product id travels in the URL; name and price come from the
        // catalog, so a crafted link cannot invent a product or a price.
        (function () {
            const params = new URLSearchParams(window.location.search);
            let product = getProduct(params.get('id'));

            // Older links used ?product=<name>&price=<price>
            if (!product && params.get('product')) {
                product = findProductByName(params.get('product'));
            }

            const view = document.getElementById('productView');

            if (!product) {
                document.title = 'Product not found';
                const heading = document.createElement('h1');
                heading.textContent = 'Product not found';
                const hint = document.createElement('p');
                hint.textContent = 'That product does not exist or is no longer available.';
                const link = document.createElement('a');
                link.href = 'products.html';
                link.className = 'btn btn-outline';
                link.textContent = 'Back to shop';
                view.append(heading, hint, link);
                return;
            }

            document.title = product.name;

            const illustration = document.createElement('div');
            illustration.className = 'product-illustration';
            illustration.style.background = product.icon.bg;
            illustration.style.color = product.icon.color;
            illustration.innerHTML = '<svg viewBox="0 0 100 100" aria-hidden="true">' + product.icon.svg + '</svg>';

            const category = document.createElement('div');
            category.className = 'product-category';
            category.textContent = product.category;

            const heading = document.createElement('h1');
            heading.textContent = product.name;

            const rating = document.createElement('div');
            rating.className = 'card-rating product-rating';
            const stars = document.createElement('span');
            stars.className = 'stars';
            stars.setAttribute('aria-label', product.rating.toFixed(1) + ' out of 5 stars');
            for (let i = 1; i <= 5; i++) {
                const star = document.createElement('span');
                star.className = 'star' + (i <= Math.round(product.rating) ? ' filled' : '');
                star.textContent = '★';
                star.setAttribute('aria-hidden', 'true');
                stars.appendChild(star);
            }
            const reviews = document.createElement('span');
            reviews.className = 'review-count';
            reviews.textContent = product.reviews.toLocaleString('en-US') + ' ratings';
            rating.append(stars, reviews);

            const blurb = document.createElement('p');
            blurb.className = 'product-blurb';
            blurb.textContent = product.blurb;

            const price = document.createElement('div');
            price.className = 'price';
            price.textContent = formatPrice(product.price);

            const addBtn = document.createElement('button');
            addBtn.type = 'button';
            addBtn.className = 'btn btn-buy add-cart-btn';
            addBtn.dataset.id = product.id;
            addBtn.textContent = 'Add to cart';

            const wishBtn = document.createElement('button');
            wishBtn.type = 'button';
            wishBtn.className = 'wishlist-btn';
            wishBtn.dataset.id = product.id;
            wishBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.35-9.5-8.5C1 8 2.5 4.5 6 4.5c2 0 3.5 1.2 4.5 2.8 1-1.6 2.5-2.8 4.5-2.8 3.5 0 5 3.5 3.5 7-2.5 4.15-9.5 8.5-9.5 8.5z"/></svg>';

            const actions = document.createElement('div');
            actions.className = 'product-actions';
            actions.append(addBtn, wishBtn);

            view.append(illustration, category, heading, rating, blurb, price, actions);
        })();
    </script>

</body>

</html>
