<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in</title>
    <link rel="stylesheet" href="css_main.css">
</head>

<body>

    <header>
        <div class="header-left">
            <button type="button" class="back-btn" onclick="history.back()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
                Back
            </button>
            <a href="index.html" class="back-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
                Home
            </a>
            <a href="products.html" class="back-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
                Shop
            </a>
        </div>
    </header>

    <main>
        <div class="auth-page">
            <div class="profile-card">
                <h1>Sign in</h1>

                <form id="loginForm" novalidate>
                    <div class="form-field">
                        <label for="loginEmail">Email</label>
                        <input type="email" id="loginEmail" autocomplete="email" required>
                    </div>
                    <div class="form-field">
                        <label for="loginPassword">Password</label>
                        <input type="password" id="loginPassword" autocomplete="current-password" required>
                    </div>

                    <p class="form-error" id="loginError" role="alert"></p>

                    <button type="submit" class="btn btn-buy" id="loginSubmit">Sign in</button>
                </form>

                <p class="auth-switch">
                    New here? <a href="register.html">Create an account</a>
                </p>
            </div>
        </div>
    </main>

    <script src="auth.js"></script>
    <script>
        const form = document.getElementById('loginForm');
        const errorEl = document.getElementById('loginError');
        const submitBtn = document.getElementById('loginSubmit');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorEl.textContent = '';
            submitBtn.disabled = true;

            try {
                await Auth.login(
                    document.getElementById('loginEmail').value.trim(),
                    document.getElementById('loginPassword').value
                );
                window.location.href = 'account.html';
            } catch (err) {
                errorEl.textContent = err.message;
                submitBtn.disabled = false;
            }
        });
    </script>

</body>

</html>
