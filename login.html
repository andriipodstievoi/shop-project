<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in</title>
    <link rel="stylesheet" href="css_main.css?v=3">
</head>

<body>

    <header>
        <div class="header-left">
            <button type="button" class="back-btn" onclick="history.back()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
                Back
            </button>
            <a href="index.html" class="back-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
                Home
            </a>
            <a href="products.html" class="back-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
                Shop
            </a>
        </div>
        <div class="header-icons">
            <div class="icon-btn">
                <a href="wishlist.html" aria-label="Wishlist">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.35-9.5-8.5C1 8 2.5 4.5 6 4.5c2 0 3.5 1.2 4.5 2.8 1-1.6 2.5-2.8 4.5-2.8 3.5 0 5 3.5 3.5 7-2.5 4.15-9.5 8.5-9.5 8.5z"/></svg>
                </a>
            </div>
            <div class="icon-btn">
                <a href="cart.html" aria-label="Cart">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="21" r="1"/><circle cx="18" cy="21" r="1"/><path d="M2.5 3h2l2.4 12.2a2 2 0 0 0 2 1.6h8.4a2 2 0 0 0 2-1.6L21 7H6"/></svg>
                    <span class="cart-badge">0</span>
                </a>
            </div>
            <div class="icon-btn">
                <a href="account.html" aria-label="Account">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 20c1-4 4.5-6 7.5-6s6.5 2 7.5 6"/></svg>
                </a>
            </div>
            <a href="contact.html" class="back-btn header-contact">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v14H4z"/><path d="M4 6l8 6 8-6"/></svg>
                Contact
            </a>
        </div>
    </header>

    <main>
        <div class="auth-page">
            <div class="profile-card">
                <h1>Sign in</h1>

                <form id="loginForm" novalidate>
                    <div class="form-field">
                        <label for="loginEmail">Email</label>
                        <input type="email" id="loginEmail" autocomplete="email" required>
                    </div>
                    <div class="form-field">
                        <label for="loginPassword">Password</label>
                        <input type="password" id="loginPassword" autocomplete="current-password" required>
                    </div>

                    <p class="form-error" id="loginError" role="alert"></p>

                    <button type="submit" class="btn btn-buy" id="loginSubmit">Sign in</button>
                </form>

                <p class="auth-switch">
                    New here? <a href="register.html">Create an account</a>
                </p>
            </div>
        </div>
    </main>

    <script src="auth.js?v=3"></script>
    <script src="cart.js?v=3"></script>
    <script>
        const form = document.getElementById('loginForm');
        const errorEl = document.getElementById('loginError');
        const submitBtn = document.getElementById('loginSubmit');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorEl.textContent = '';
            submitBtn.disabled = true;

            try {
                await Auth.login(
                    document.getElementById('loginEmail').value.trim(),
                    document.getElementById('loginPassword').value
                );
                // Anything collected while signed out follows the visitor in
                await Store.mergeGuestIntoAccount();
                window.location.href = 'account.html';
            } catch (err) {
                errorEl.textContent = err.message;
                submitBtn.disabled = false;
            }
        });
    </script>

</body>

</html>
