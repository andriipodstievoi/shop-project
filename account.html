<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Account</title>
    <link rel="stylesheet" href="css_main.css">
</head>

<body>

    <header>
        <div class="header-left">
            <button type="button" class="back-btn" onclick="history.back()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
                Back
            </button>
            <a href="index.html" class="back-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
                Home
            </a>
            <a href="products.html" class="back-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
                Shop
            </a>
        </div>
        <div class="header-icons">
            <div class="icon-btn">
                <a href="wishlist.html" aria-label="Wishlist">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.35-9.5-8.5C1 8 2.5 4.5 6 4.5c2 0 3.5 1.2 4.5 2.8 1-1.6 2.5-2.8 4.5-2.8 3.5 0 5 3.5 3.5 7-2.5 4.15-9.5 8.5-9.5 8.5z"/></svg>
                </a>
            </div>
            <div class="icon-btn">
                <a href="cart.html" aria-label="Cart">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="21" r="1"/><circle cx="18" cy="21" r="1"/><path d="M2.5 3h2l2.4 12.2a2 2 0 0 0 2 1.6h8.4a2 2 0 0 0 2-1.6L21 7H6"/></svg>
                    <span class="cart-badge">0</span>
                </a>
            </div>
            <div class="icon-btn">
                <a href="account.html" aria-label="Account">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 20c1-4 4.5-6 7.5-6s6.5 2 7.5 6"/></svg>
                </a>
            </div>
        </div>
    </header>

    <main>
        <div class="account-page">

            <!-- Shown while the session is being checked -->
            <p id="accountLoading" class="account-loading">Loading…</p>

            <!-- Signed out -->
            <section class="profile-card" id="signedOutCard" hidden>
                <h1>My Account</h1>
                <p>Sign in to keep your details with your account.</p>
                <div class="profile-actions">
                    <a href="login.html" class="btn btn-buy">Sign in</a>
                    <a href="register.html" class="btn btn-outline">Create account</a>
                </div>
            </section>

            <!-- Signed in -->
            <div id="signedInArea" hidden>
                <div class="account-header">
                    <h1>My Account</h1>
                    <button type="button" class="btn btn-outline" id="logoutBtn">Sign out</button>
                </div>

                <section class="profile-card">
                    <h2>Personal info</h2>

                    <div class="form-field">
                        <label>Email</label>
                        <p class="static-field" id="profileEmail"></p>
                        <span class="field-hint">Email is used to sign in and cannot be changed here.</span>
                    </div>

                    <form id="profileForm">
                        <div class="form-field">
                            <label for="profileName">Name</label>
                            <input type="text" id="profileName" placeholder="Your name">
                        </div>
                        <div class="form-field">
                            <label for="profilePhone">Phone</label>
                            <input type="tel" id="profilePhone" placeholder="+380 00 000 0000">
                        </div>
                        <div class="profile-actions">
                            <button type="submit" class="btn btn-buy">Save</button>
                            <span class="save-confirm" id="saveConfirm">Saved ✓</span>
                            <span class="form-error" id="profileError" role="alert"></span>
                        </div>
                    </form>
                </section>

                <div class="account-links">
                    <a class="account-link" href="orders.html">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2h9l4 4v16H6z"/><path d="M9 12h7M9 16h7M9 8h3"/></svg>
                        <span>My Orders</span>
                    </a>
                    <a class="account-link" href="cart.html">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="21" r="1"/><circle cx="18" cy="21" r="1"/><path d="M2.5 3h2l2.4 12.2a2 2 0 0 0 2 1.6h8.4a2 2 0 0 0 2-1.6L21 7H6"/></svg>
                        <span>Your Cart</span>
                        <span class="cart-badge">0</span>
                    </a>
                    <a class="account-link" href="wishlist.html">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.35-9.5-8.5C1 8 2.5 4.5 6 4.5c2 0 3.5 1.2 4.5 2.8 1-1.6 2.5-2.8 4.5-2.8 3.5 0 5 3.5 3.5 7-2.5 4.15-9.5 8.5-9.5 8.5z"/></svg>
                        <span>Your Wishlist</span>
                    </a>
                    <a class="account-link" href="admin.html" id="adminLink" hidden>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v6c0 4-3 7-7 9-4-2-7-5-7-9V6z"/></svg>
                        <span>Admin panel</span>
                    </a>
                </div>
            </div>

        </div>
    </main>

    <script src="auth.js"></script>
    <script src="cart.js"></script>
    <script>
        (async () => {
            const loading = document.getElementById('accountLoading');
            const signedOut = document.getElementById('signedOutCard');
            const signedIn = document.getElementById('signedInArea');

            const user = await Auth.load();
            loading.hidden = true;

            if (!user) {
                signedOut.hidden = false;
                return;
            }

            signedIn.hidden = false;
            document.getElementById('profileEmail').textContent = user.email;
            document.getElementById('profileName').value = user.name || '';
            document.getElementById('profilePhone').value = user.phone || '';

            if (Auth.isAdmin()) {
                document.getElementById('adminLink').hidden = false;
            }

            const confirmEl = document.getElementById('saveConfirm');
            const errorEl = document.getElementById('profileError');

            document.getElementById('profileForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                errorEl.textContent = '';
                try {
                    await Auth.saveProfile(
                        document.getElementById('profileName').value.trim(),
                        document.getElementById('profilePhone').value.trim()
                    );
                    confirmEl.classList.add('show');
                    setTimeout(() => confirmEl.classList.remove('show'), 1500);
                } catch (err) {
                    errorEl.textContent = err.message;
                }
            });

            document.getElementById('logoutBtn').addEventListener('click', async () => {
                await Auth.logout();
                window.location.href = 'index.html';
            });
        })();
    </script>

</body>

</html>
