<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact us</title>
    <link rel="stylesheet" href="css_main.css?v=3">
</head>

<body>

    <header>
        <div class="header-left">
            <button type="button" class="back-btn" onclick="history.back()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
                Back
            </button>
            <a href="index.html" class="back-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
                Home
            </a>
            <a href="products.html" class="back-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
                Shop
            </a>
        </div>
        <div class="header-icons">
            <div class="icon-btn">
                <a href="wishlist.html" aria-label="Wishlist">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.35-9.5-8.5C1 8 2.5 4.5 6 4.5c2 0 3.5 1.2 4.5 2.8 1-1.6 2.5-2.8 4.5-2.8 3.5 0 5 3.5 3.5 7-2.5 4.15-9.5 8.5-9.5 8.5z"/></svg>
                </a>
            </div>
            <div class="icon-btn">
                <a href="cart.html" aria-label="Cart">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="21" r="1"/><circle cx="18" cy="21" r="1"/><path d="M2.5 3h2l2.4 12.2a2 2 0 0 0 2 1.6h8.4a2 2 0 0 0 2-1.6L21 7H6"/></svg>
                    <span class="cart-badge">0</span>
                </a>
            </div>
            <div class="icon-btn">
                <a href="account.html" aria-label="Account">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 20c1-4 4.5-6 7.5-6s6.5 2 7.5 6"/></svg>
                </a>
            </div>
            <a href="contact.html" class="back-btn header-contact">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v14H4z"/><path d="M4 6l8 6 8-6"/></svg>
                Contact
            </a>
        </div>
    </header>

    <main>
        <div class="auth-page contact-page">
            <div class="profile-card">
                <h1>Contact us</h1>
                <p class="contact-intro">
                    Questions about an order, a product or a delivery? Write to us and we
                    will get back to you by email.
                </p>

                <form id="contactForm" novalidate>
                    <div class="form-field">
                        <label for="contactFormName">Your name</label>
                        <input type="text" id="contactFormName" autocomplete="name" required>
                    </div>
                    <div class="form-field">
                        <label for="contactFormEmail">Email</label>
                        <input type="email" id="contactFormEmail" autocomplete="email" required>
                        <span class="field-hint">We reply to this address.</span>
                    </div>
                    <div class="form-field">
                        <label for="contactFormSubject">Subject <span class="field-hint">(optional)</span></label>
                        <input type="text" id="contactFormSubject" placeholder="Order #12, delivery question…">
                    </div>
                    <div class="form-field">
                        <label for="contactFormMessage">Message</label>
                        <textarea id="contactFormMessage" rows="6" required></textarea>
                    </div>

                    <p class="form-error" id="contactError" role="alert"></p>

                    <button type="submit" class="btn btn-buy" id="contactSubmit">Send message</button>
                </form>
            </div>

            <section class="profile-card contact-sent" id="contactSent" hidden>
                <h2>Message sent</h2>
                <p>Thank you — we have your message and will reply by email.</p>
                <div class="profile-actions">
                    <a href="products.html" class="btn btn-buy">Keep shopping</a>
                    <a href="index.html" class="btn btn-outline">Home</a>
                </div>
            </section>
        </div>
    </main>

    <script src="auth.js?v=3"></script>
    <script>
        (async () => {
            const form = document.getElementById('contactForm');
            const errorEl = document.getElementById('contactError');
            const submitBtn = document.getElementById('contactSubmit');
            const sent = document.getElementById('contactSent');

            // Signed-in visitors do not retype what the account already knows
            const user = await Auth.load();
            if (user) {
                document.getElementById('contactFormName').value = user.name || '';
                document.getElementById('contactFormEmail').value = user.email || '';
            }

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                errorEl.textContent = '';
                submitBtn.disabled = true;

                try {
                    await Auth.post('api/contact.php', {
                        name: document.getElementById('contactFormName').value.trim(),
                        email: document.getElementById('contactFormEmail').value.trim(),
                        subject: document.getElementById('contactFormSubject').value.trim(),
                        message: document.getElementById('contactFormMessage').value.trim()
                    });
                    form.closest('.profile-card').hidden = true;
                    sent.hidden = false;
                } catch (err) {
                    errorEl.textContent = err.message;
                    submitBtn.disabled = false;
                }
            });
        })();
    </script>

</body>

</html>
