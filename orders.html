<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Orders</title>
    <link rel="stylesheet" href="css_main.css">
</head>

<body>

    <header>
        <div class="header-left">
            <button type="button" class="back-btn" onclick="history.back()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
                Back
            </button>
            <a href="index.html" class="back-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
                Home
            </a>
            <a href="products.html" class="back-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
                Shop
            </a>
        </div>
    </header>

    <main>
        <div class="cart-page">
            <h1>My Orders</h1>

            <p id="ordersLoading" class="account-loading">Loading…</p>

            <section class="profile-card" id="ordersSignedOut" hidden>
                <p>Sign in to see your orders.</p>
                <div class="profile-actions">
                    <a href="login.html" class="btn btn-buy">Sign in</a>
                </div>
            </section>

            <div id="ordersList"></div>
        </div>
    </main>

    <script src="auth.js"></script>
    <script src="cart.js"></script>
    <script src="orders-ui.js"></script>
    <script>
        (async () => {
            const loading = document.getElementById('ordersLoading');
            const signedOut = document.getElementById('ordersSignedOut');
            const list = document.getElementById('ordersList');

            const user = await Auth.load();
            loading.hidden = true;

            if (!user) {
                signedOut.hidden = false;
                return;
            }

            try {
                const data = await Auth.get('api/orders.php');
                const orders = data.orders || [];

                if (orders.length === 0) {
                    const empty = document.createElement('p');
                    empty.className = 'cart-empty';
                    empty.textContent = 'No orders yet. ';
                    const link = document.createElement('a');
                    link.href = 'products.html';
                    link.textContent = 'Browse products';
                    empty.appendChild(link);
                    list.appendChild(empty);
                    return;
                }

                orders.forEach((order) => list.appendChild(buildOrderCard(order)));
            } catch (err) {
                const msg = document.createElement('p');
                msg.className = 'form-error';
                msg.textContent = err.message;
                list.appendChild(msg);
            }
        })();
    </script>

</body>

</html>
