<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin</title>
    <link rel="stylesheet" href="css_main.css">
</head>

<body>

    <header>
        <div class="header-left">
            <button type="button" class="back-btn" onclick="history.back()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
                Back
            </button>
            <a href="index.html" class="back-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
                Home
            </a>
            <a href="account.html" class="back-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 20c1-4 4.5-6 7.5-6s6.5 2 7.5 6"/></svg>
                Account
            </a>
        </div>
    </header>

    <main>
        <div class="admin-page">
            <h1>Admin panel</h1>

            <p id="adminLoading" class="account-loading">Loading…</p>

            <section class="profile-card" id="adminDenied" hidden>
                <h2>Not available</h2>
                <p id="adminDeniedText"></p>
                <div class="profile-actions">
                    <a href="index.html" class="btn btn-outline">Back to shop</a>
                </div>
            </section>

            <div id="adminArea" hidden>
                <div class="stat-row" id="statRow"></div>

                <div class="admin-tabs">
                    <button type="button" class="tab-btn active" data-tab="orders">Orders</button>
                    <button type="button" class="tab-btn" data-tab="users">Users</button>
                </div>

                <div id="tabOrders"></div>
                <div id="tabUsers" hidden></div>
            </div>
        </div>
    </main>

    <script src="auth.js"></script>
    <script src="cart.js"></script>
    <script src="orders-ui.js"></script>
    <script>
        (async () => {
            const loading = document.getElementById('adminLoading');
            const denied = document.getElementById('adminDenied');
            const deniedText = document.getElementById('adminDeniedText');
            const area = document.getElementById('adminArea');

            const user = await Auth.load();
            loading.hidden = true;

            // Convenience only: the server rejects non-admins regardless
            if (!user) {
                deniedText.textContent = 'Sign in with an admin account to view this page.';
                denied.hidden = false;
                return;
            }
            if (!Auth.isAdmin()) {
                deniedText.textContent = 'This account does not have admin access.';
                denied.hidden = false;
                return;
            }

            area.hidden = false;

            function statTile(label, value) {
                const tile = document.createElement('div');
                tile.className = 'stat-tile';
                const v = document.createElement('div');
                v.className = 'stat-value';
                v.textContent = value;
                const l = document.createElement('div');
                l.className = 'stat-label';
                l.textContent = label;
                tile.append(v, l);
                return tile;
            }

            try {
                const summary = await Auth.get('api/admin.php?resource=summary');
                const row = document.getElementById('statRow');
                row.append(
                    statTile('Users', summary.users),
                    statTile('Orders', summary.orders),
                    statTile('Awaiting action', summary.pending),
                    statTile('Revenue', formatPrice(summary.revenue))
                );

                const ordersData = await Auth.get('api/admin.php?resource=orders');
                const ordersTab = document.getElementById('tabOrders');

                if (!ordersData.orders.length) {
                    const empty = document.createElement('p');
                    empty.className = 'cart-empty';
                    empty.textContent = 'No orders yet.';
                    ordersTab.appendChild(empty);
                } else {
                    ordersData.orders.forEach((order) => {
                        ordersTab.appendChild(buildOrderCard(order, {
                            showCustomer: true,
                            onStatusChange: (orderId, status) =>
                                Auth.post('api/admin.php', {
                                    action: 'set_status',
                                    order_id: orderId,
                                    status: status
                                })
                        }));
                    });
                }

                const usersData = await Auth.get('api/admin.php?resource=users');
                const usersTab = document.getElementById('tabUsers');

                const table = document.createElement('table');
                table.className = 'admin-table';
                const thead = document.createElement('thead');
                const headRow = document.createElement('tr');
                ['Email', 'Name', 'Phone', 'Role', 'Orders', 'Joined'].forEach((h) => {
                    const th = document.createElement('th');
                    th.textContent = h;
                    headRow.appendChild(th);
                });
                thead.appendChild(headRow);
                table.appendChild(thead);

                const tbody = document.createElement('tbody');
                usersData.users.forEach((u) => {
                    const tr = document.createElement('tr');
                    [
                        u.email,
                        u.name || '—',
                        u.phone || '—',
                        u.role,
                        String(u.order_count),
                        formatOrderDate(u.created_at)
                    ].forEach((value) => {
                        const td = document.createElement('td');
                        td.textContent = value;
                        tr.appendChild(td);
                    });
                    tbody.appendChild(tr);
                });
                table.appendChild(tbody);

                const wrap = document.createElement('div');
                wrap.className = 'table-scroll';
                wrap.appendChild(table);
                usersTab.appendChild(wrap);
            } catch (err) {
                const msg = document.createElement('p');
                msg.className = 'form-error';
                msg.textContent = err.message;
                area.appendChild(msg);
            }

            document.querySelectorAll('.tab-btn').forEach((btn) => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.tab-btn').forEach((b) => b.classList.remove('active'));
                    btn.classList.add('active');
                    document.getElementById('tabOrders').hidden = btn.dataset.tab !== 'orders';
                    document.getElementById('tabUsers').hidden = btn.dataset.tab !== 'users';
                });
            });
        })();
    </script>

</body>

</html>
